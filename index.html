<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suraj weds Neetu | Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--cream:#f6ecd2;--paper:#fbf5e3;--maroon:#7b1e22;--olive:#566623;--gold:#c9a24b;--gold-lt:#efd98d;--deep:#06301f;--royal:#0d4a31;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{color:var(--maroon);font-family:"Cormorant Garamond",Georgia,serif;overflow:hidden;
background:radial-gradient(circle at 50% 45%,#fff8e4 0,var(--cream) 55%,#ecd9a6 100%)}
body::before{content:"";position:fixed;inset:0;opacity:.18;background-image:radial-gradient(var(--gold) 1.2px,transparent 1.6px);background-size:22px 22px;pointer-events:none}
.deco{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px;pointer-events:none;display:block}
.deco.top{top:0}.deco.bot{bottom:0}
.str{transform-box:fill-box;transform-origin:50% 0;animation:sway 5s ease-in-out infinite}
.str:nth-of-type(2n){animation-delay:-1.7s}.str:nth-of-type(3n){animation-delay:-3.1s}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.stage{position:relative;height:100%;display:grid;place-items:center;padding:calc(110px + env(safe-area-inset-top,0px)) 14px 130px}
.card{width:min(90vw,400px);max-height:100%;overflow:auto;background:rgba(251,245,227,.94);border:2px solid var(--gold);outline:5px solid rgba(201,162,75,.35);outline-offset:4px;border-radius:10px;padding:22px 20px 16px;text-align:center;box-shadow:0 14px 44px rgba(90,50,10,.28)}
.gan{margin:0;font-style:italic;font-size:1.1rem;color:var(--olive)}
.script{font-family:"Great Vibes",cursive;font-weight:400}
h1{margin:2px 0 0;font-size:2.8rem;line-height:1.1;color:var(--maroon)}
.sub{margin:0 0 6px;font-size:1.15rem;letter-spacing:.04em}
.orn{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:10px auto;width:75%}
.reveal{position:relative;border-radius:8px;min-height:210px;background:var(--paper);border:1px solid var(--gold);display:grid;place-content:center;padding:14px;overflow:hidden}
.nm{margin:0;font-size:2.5rem;line-height:1.15;color:var(--maroon)}
.weds{margin:2px 0;font-style:italic;font-size:1.2rem;color:var(--olive)}
.dt{margin:10px 0 0;padding-top:8px;border-top:1px solid var(--gold);font-size:1.35rem;font-weight:700}
#scratch{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .8s}
#scratch.done{opacity:0;pointer-events:none}
.hint{margin:10px 0 0;min-height:2.2em;color:var(--olive);font-size:1.05rem}
.btn{font:inherit;font-size:1.1rem;font-weight:700;border:1.5px solid var(--maroon);background:var(--maroon);color:var(--paper);border-radius:30px;padding:7px 22px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--maroon)}
.btn:focus-visible,.mute:focus-visible,.door:focus-visible .tap{outline:3px solid var(--olive);outline-offset:3px}
.page{display:none;animation:in .5s}.page.on{display:block}
@keyframes in{from{opacity:0}}
.page h2{margin:0;font-size:2.6rem;line-height:1.15;color:var(--maroon)}
.pd{margin:2px 0 0;font-size:1.25rem;font-weight:700;color:var(--olive)}
.row{display:flex;justify-content:space-between;gap:10px;text-align:left;padding:9px 0;border-bottom:1px dotted var(--gold);font-size:1.2rem}
.row span:last-child{white-space:nowrap;font-weight:700;color:var(--olive)}
.blk{margin:10px 0;font-size:1.12rem;line-height:1.45}.blk b{color:var(--olive);font-size:1.2rem}
.verse{border:1px solid var(--gold);border-radius:8px;padding:9px;font-size:1.05rem;line-height:1.45;font-style:italic;color:var(--olive)}
.nav{display:none;justify-content:space-between;align-items:center;margin-top:14px}.nav.on{display:flex}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--gold);opacity:.45}.dots i.on{opacity:1;background:var(--maroon)}
.mute{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:5;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--gold);background:var(--paper);color:var(--maroon);font-size:1.1rem;cursor:pointer;display:none}.mute.on{display:block}
.door{position:fixed;inset:0;z-index:10;display:flex;perspective:1400px;background:transparent;border:0;padding:0;width:100%;cursor:pointer;font-family:inherit}
.door.gone{display:none}
.leaf{flex:1;position:relative;background:linear-gradient(160deg,#1a6b45,var(--royal) 55%,var(--deep));transition:transform 1.8s cubic-bezier(.6,.05,.25,1);box-shadow:inset 0 0 0 6px var(--gold),inset 0 0 0 14px var(--deep),inset 0 0 0 16px var(--gold)}
.leaf.l{transform-origin:left center}.leaf.r{transform-origin:right center}
.leaf::before{content:"";position:absolute;inset:12% 16%;border:2px solid var(--gold);border-radius:120px 120px 6px 6px;opacity:.7}
.leaf::after{content:"";position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--gold-lt);box-shadow:0 0 0 4px var(--gold)}
.leaf.l::after{right:14px}.leaf.r::after{left:14px}
.door.open .l{transform:rotateY(-104deg)}.door.open .r{transform:rotateY(104deg)}
.tap{position:absolute;left:50%;bottom:calc(14% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2;padding:12px 28px;border-radius:40px;background:var(--paper);color:var(--maroon);font-size:1.4rem;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.45);transition:opacity .4s;white-space:nowrap}
.door.open .tap{opacity:0}
@media (prefers-reduced-motion:reduce){.leaf,#scratch{transition-duration:.01s}.str{animation:none}.page{animation:none}}
</style>
</head>

  try{img=ctx.getImageData(0,0,cv.width,cv.height).data}catch(x){return}
  var c=0,t=0;for(var i=3;i<img.length;i+=64){t++;if(img[i]===0)c++}
  if(c/t>.5){
    finished=true;cv.classList.add('done');
    hint.innerHTML='<button class="btn" id="go">See the schedule</button>';
    $('go').onclick=function(){nav.classList.add('on');show(1)};
  }
}
cv.addEventListener('pointerdown',function(e){drawing=true;cv.setPointerCapture(e.pointerId);scratch(e)});
cv.addEventListener('pointermove',scratch);
cv.addEventListener('pointerup',function(){drawing=false;check()});
cv.addEventListener('pointercancel',function(){drawing=false;check()});
function setMute(){mute.textContent=audio.paused?'✕':'♪';mute.setAttribute('aria-pressed',audio.paused)}
mute.onclick=function(){if(audio.paused)audio.play().catch(function(){});else audio.pause();setMute()};
audio.addEventListener('play',setMute);audio.addEventListener('pause',setMute);
door.addEventListener('click',function(){
  if(door.classList.contains('open'))return;
  door.classList.add('open');audio.play().catch(function(){});mute.classList.add('on');
  setTimeout(function(){door.classList.add('gone')},1900);
});
paintFoil();
window.addEventListener('resize',function(){if(!started&&!finished)paintFoil()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(!started)paintFoil()});
})();
</script>
</body>
